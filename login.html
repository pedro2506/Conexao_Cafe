<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Login - Conexão Café
    </title>

    <link rel="stylesheet" href="./src/css/login.css">

</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <div class="login-card">

                <header class="login-header">

                    <a href="./index.html" class="logo">
                        Conexão Café
                    </a>

                    <p class="login-subtitle">
                        Bem-vindo de volta
                    </p>

                    <h1>
                        Acesse sua conta
                    </h1>

                    <p class="login-description">
                        Entre para continuar sua experiência com o melhor café.
                    </p>

                </header>

                <form
                    id="form-login"
                    class="login-form"
                >

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                        <span
                            id="erro-email"
                            class="mensagem-erro"
                        ></span>

                    </div>

                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                        <span
                            id="erro-senha"
                            class="mensagem-erro"
                        ></span>

                    </div>

                    <button
                        type="submit"
                        class="button"
                    >
                        Entrar
                    </button>

                    <p
                        id="mensagem-login"
                        class="mensagem-login"
                    ></p>

                </form>

                <footer class="login-footer">

                    <p>
                        Ainda não possui conta?
                    </p>

                    <a href="./cadastro.html">
                        Criar cadastro
                    </a>

                </footer>

            </div>

        </section>

    </main>

    <script src="./src/js/login.js"></script>

</body>

</html>
